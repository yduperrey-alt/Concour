name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances système
        run: |
          sudo apt update -qq
          sudo apt install -y -qq git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev build-essential

      - name: Installer buildozer (version figée, stable)
        run: pip install buildozer==1.5.0 cython==3.0.10 virtualenv

      - name: Compiler l'APK
        run: buildozer -v android debug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
